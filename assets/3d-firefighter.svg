  <!-- neck -->
  <rect x="238" y="188" width="44" height="34" rx="10" fill="url(#skin)"/>

  <!-- head -->
  <path d="M198 128 Q198 198 260 202 Q322 198 322 128 Q322 86 260 84 Q198 86 198 128 Z" fill="url(#skin)"/>
  <path d="M222 140 Q232 134 242 140" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M278 140 Q288 134 298 140" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M246 162 Q260 172 274 162" stroke="#B45309" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- helmet -->
  <path d="M182 128 Q186 52 260 48 Q334 52 338 128 Z" fill="url(#helmet)"/>
  <path d="M160 128 H360 Q370 128 370 140 Q370 148 360 148 H160 Q150 148 150 140 Q150 128 160 128 Z" fill="#F59E0B"/>
  <path d="M260 66 L278 66 L278 96 L270 108 L250 96 L250 66 Z" fill="#B45309"/>
  <path d="M198 128 Q260 120 322 128" stroke="#FDE68A" stroke-width="5" fill="none" opacity="0.7"/>
</svg>
