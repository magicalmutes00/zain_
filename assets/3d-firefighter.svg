<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="520" height="620">
  <defs>
    <linearGradient id="helmet" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="coat" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="coatHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.55"/>
      <stop offset="1%" stop-color="#475569" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FDE3CC"/>
      <stop offset="100%" stop-color="#E8B89A"/>
    </linearGradient>
    <linearGradient id="ext" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A4C"/>
      <stop offset="45%" stop-color="#F88A32"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="extSh" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="260" cy="585" rx="170" ry="24" fill="url(#shadow)"/>

