# Render blueprint for zaintechoman.com (React Vite SPA)
# NOTE: render.yaml only applies when creating a service from a blueprint.
# For the existing service, add the same rewrite in the dashboard once:
# Static Site → Redirects/Rewrites → Add Rule → Source "/*",
# Destination "/index.html", Action "Rewrite".
# Existing static files (robots.txt, sitemap.xml, assets) keep serving normally;
# the rewrite only fires for paths with no matching file (the SPA routes).
services:
  - type: web
    name: zain-technical-oman
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: zain-api
          property: host
        # Render injects the host; the API serves under /api, so the
        # effective value must be https://<host> — set the full URL in the
        # dashboard instead if this does not resolve with scheme.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: zain-api
    runtime: node
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://zaintechoman.com
