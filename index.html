    <!-- Company logo loader. Kept inline in <head> so it is painted on the very first
         frame — before the stylesheet or the app bundle has arrived — which is the whole
         point of a loading screen. The pale surface + wordmark are the PRE-ROLL and the
         fallback; the client's 8s film then covers them (black layer, `contain`) and the
         overlay leaves when the film ends. The bar is a brand-blue sweep on a navy-tint
         track for the fallback path. Choreography of the static mark: it rises and fades
         in, then floats gently while a white glint sweeps its letterforms. The overlay is
         decorative (aria-hidden): the page is already in the document, so screen readers
         are never held behind it. Literal colours here on purpose — this block must be
         correct before index.css has loaded. -->
    <style>
      #zain-preloader {
        position: fixed;
        inset: 0;
        z-index: 3000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        background: linear-gradient(180deg, #eef3f9 0%, #ffffff 70%);
        opacity: 1;
        transition: opacity 0.32s ease;
        overflow: hidden;
      }
      #zain-preloader[data-out] { opacity: 0; pointer-events: none; }
      /* The client's own film takes the screen while it plays. The layer is black so the
         letterbox `contain` leaves on non-16:9 viewports is invisible, and it sits ABOVE
         the wordmark: the pale splash is the pre-roll, then the film covers it. `contain`
         (never `cover`) — on a portrait phone, cover would crop away three quarters of the
         composition, whose content spans almost the full frame width. */
      #zain-preloader .vid {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: #000;
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: none;
      }
      #zain-preloader[data-video] .vid { opacity: 1; }
      #zain-preloader .vid video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #zain-preloader .mark {
        position: relative;
        display: block;
        animation: zain-logo-float 3.6s ease-in-out 0.95s infinite;
      }
      #zain-preloader img {
        display: block;
        width: min(420px, 72vw);
        height: auto;
        object-fit: contain;
        animation: zain-logo-in 0.75s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #zain-preloader .bar {
        width: min(170px, 38vw);
        height: 3px;
        border-radius: 999px;
        background: rgba(12, 49, 89, 0.1);
        position: relative;
        z-index: 2;
        overflow: hidden;
        transform-origin: center;
        transition: opacity 0.3s ease;
        animation: zain-bar-in 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
      }
      #zain-preloader .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #174d91 50%, transparent);
        background-size: 200% 100%;
        animation: zain-preload 1.2s ease-in-out infinite;
      }
      /* The film carries its own motion — a progress line drawn across the client's
         artwork would only get in its way, so the bar bows out while it plays. Its
         entrance animation is cancelled at the same time: the `both` fill would otherwise
         pin opacity at 1 and the bar would never actually leave. */
      #zain-preloader[data-video] .bar {
        animation: none;
        opacity: 0;
      }
      /* The glint: a white band masked to the wordmark's own alpha shape, so the shine
         travels across the letterforms and nowhere else. The standard `mask` lives here
         and the prefixed form in its own @supports block — written together, the
         production minifier collapses the pair and drops the standard property
         (the same trap as backdrop-filter in src/index.css). */
      #zain-preloader .mark::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-140%);
        background: linear-gradient(
          100deg,
          transparent 42%,
          rgba(255, 255, 255, 0.92) 50%,
          transparent 58%
        );
        animation: zain-sheen 3.8s ease-in-out 1.25s infinite;
        mask: url("/assets/zain-logo-loader.webp") center / 100% 100% no-repeat;
      }
      @supports (-webkit-mask-image: url("/assets/zain-logo-loader.webp")) {
        #zain-preloader .mark::after {
          -webkit-mask: url("/assets/zain-logo-loader.webp") center / 100% 100% no-repeat;
        }
      }
      #zain-preloader[data-out] .mark {
        animation: none;
        opacity: 0;
        transform: scale(1.06);
        transition: opacity 0.35s ease, transform 0.5s ease-out;
      }
      @keyframes zain-logo-in {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.94);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes zain-logo-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      @keyframes zain-bar-in {
        from {
          opacity: 0;
          transform: scaleX(0);
        }
        to {
          opacity: 1;
          transform: scaleX(1);
        }
      }
      @keyframes zain-sheen {
        0% {
          transform: translateX(-140%);
        }
        42%,
        100% {
          transform: translateX(140%);
        }
      }
      @keyframes zain-preload {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #zain-preloader { transition: none; }
        #zain-preloader img,
        #zain-preloader .mark,
        #zain-preloader .bar {
          animation: none !important;
          transform: none !important;
          opacity: 1 !important;
        }
        #zain-preloader .bar::after { animation: none; background-position: 0 0; }
        #zain-preloader .mark::after { display: none; }
        /* No film for visitors who asked for less motion — they get the static wordmark,
           and the script never even requests the 1 MB file. */
        #zain-preloader .vid { display: none !important; }
      }
      @media print { #zain-preloader { display: none !important; } }
    </style>
  </head>
  <body>
    <!-- Company loader: outside #root so React never manages it, and self-removing so it
         cannot intercept a click or linger in the accessibility tree afterwards. -->
    <div id="zain-preloader" aria-hidden="true">
      <div class="vid">
        <video id="zain-splash" muted playsinline preload="auto" disablepictureinpicture></video>
      </div>
      <span class="mark"><img src="/assets/zain-logo-loader.webp" alt="" width="1363" height="305" /></span>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var el = document.getElementById("zain-preloader");
        if (!el) return;
        var MIN = 1500,   /* floor: the splash never flashes past */
          MAX = 10000,    /* hard cap: outlasts the 8s film, still protects slow connections */
          TAIL = 300,     /* beat between the film's last frame and the fade */
          FADE = 400,
          REVEAL = 900;   /* how far into the film its glow must have built before the
                             black layer takes over the wordmark (see revealFilm) */
        var t0 = Date.now();
        var done = false;
        var loaded = document.readyState === "complete";
        var reduce = !!(
          window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches
        );
        /* The film is the main event, so the overlay leaves after its FINAL FRAME rather
           than on a timer. `videoDoneAt` is an ELAPSED moment on the same clock tick()
           compares against (Date.now() - t0), never a wall-clock one - stored as epoch it
           would be larger than any `t` and the film would silently be cut by the cap every
           time. Infinity means "not finished yet" until `ended`/`error` says otherwise.
           Under reduced motion nothing is fetched or played and it stays 0, which is
           exactly the old load + MIN schedule. The src is set here rather than in the
           markup for that reason: motion-sensitive visitors never download the film. */
        var videoDoneAt = reduce ? 0 : Infinity;
        var video = document.getElementById("zain-splash");

        function filmFinished() {
          if (videoDoneAt === Infinity) videoDoneAt = Date.now() - t0 + TAIL;
        }

        /* The film opens on ~0.55s of dead black and its glow only builds after that.
           Fading the black layer in on `playing` would therefore leave the screen empty
           for the better part of a second - it reads as "nothing is loading". So the
           wordmark holds the screen until the film is actually showing something, and
           only then does the black layer cross over it. The film's own opening is dark
           and slow by design, so nothing worth seeing is missed by waiting for it. */
        function revealFilm() {
          (function check() {
            if (done || videoDoneAt !== Infinity) return;
            if (video.currentTime * 1000 >= REVEAL) {
              el.setAttribute("data-video", "");
              return;
            }
            requestAnimationFrame(check);
          })();
        }

        if (video && !reduce) {
          video.muted = true; /* property as well as attribute: the attribute alone is not
                                 always honoured by every engine */
          video.src = "/assets/zain-loading-screen.mp4";
          video.addEventListener("playing", revealFilm);
          video.addEventListener("ended", filmFinished);
          video.addEventListener("error", filmFinished);
          var started = video.play();
          if (started && started.catch) started.catch(filmFinished); /* refused: static fallback */
        }
        if (!loaded) {
          window.addEventListener(
            "load",
            function () {
              loaded = true;
            },
            { once: true },
          );
        }

        /* Leaves when the page is ready AND the film has finished (or never ran), never
           before MIN, and always by MAX. Removed outright, not just hidden. */
        function tick() {
          if (done) return;
          var t = Date.now() - t0;
          if (t >= MAX || (loaded && t >= MIN && t >= videoDoneAt)) {
            done = true;
            if (reduce) {
              el.remove();
              return;
            }
            el.setAttribute("data-out", "");
            window.setTimeout(function () {
              el.remove();
            }, FADE);
            return;
          }
          window.setTimeout(tick, 120);
        }
        tick();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
