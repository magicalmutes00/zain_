<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Page Not Found">
  <defs>
    <linearGradient id="bg404" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2647"/>
      <stop offset="100%" stop-color="#144272"/>
    </linearGradient>
    <linearGradient id="num404" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg404)"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0"   y1="80"  x2="600" y2="80"/>
    <line x1="0"   y1="160" x2="600" y2="160"/>
    <line x1="0"   y1="240" x2="600" y2="240"/>
    <line x1="0"   y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0"   x2="120" y2="400"/>
    <line x1="240" y1="0"   x2="240" y2="400"/>
    <line x1="360" y1="0"   x2="360" y2="400"/>
    <line x1="480" y1="0"   x2="480" y2="400"/>
  </g>

  <!-- Big "404" -->
  <text x="300" y="260"
        font-family="Inter, Arial, sans-serif"
        font-weight="900"
        font-size="220"
        text-anchor="middle"
        fill="url(#num404)"
        letter-spacing="-8">404</text>

  <!-- Accent bar -->
  <rect x="40" y="40" width="80" height="6" rx="3" fill="#FF6B35"/>

  <!-- Tagline -->
  <text x="40" y="80" font-family="Inter, Arial, sans-serif" font-weight="700"
        font-size="22" fill="#FFFFFF">Page Not Found</text>
  <text x="40" y="108" font-family="Inter, Arial, sans-serif" font-weight="400"
        font-size="16" fill="#B8C4D9">The page you are looking for doesn’t exist or has been moved.</text>

  <!-- Logo mark (bottom right) -->
  <g transform="translate(500,300)">
    <rect width="64" height="64" rx="12" fill="#0A2647" stroke="#FF6B35" stroke-width="2"/>
    <path d="M16 16 L32 48 L48 16 Z" fill="#FF6B35"/>
    <circle cx="32" cy="32" r="8" fill="#FF6B35"/>
  </g>
</svg>
